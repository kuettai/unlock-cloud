<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AWS Puzzle Lock Tests 4</title>
<style>
:root{--bg:#0a0e17;--surface:#141b2d;--border:#1e2a45;--text:#e0e6f0;--muted:#7a8ba8;--accent:#3b82f6;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:32px;overflow-y:auto}
h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
section{width:100%;max-width:420px}
hr{border:none;border-top:1px solid var(--border);width:100%;max-width:420px}
</style>
</head>
<body>
  <section><h3>Security Group Lock</h3><div id="sg"></div></section><hr>
  <section><h3>Subnet CIDR Lock</h3><div id="cidr"></div></section><hr>
  <section><h3>WAF Rule Lock</h3><div id="waf"></div></section><hr>
  <section><h3>Container Task Lock</h3><div id="task"></div></section><hr>
  <section><h3>Lambda Chain Lock</h3><div id="chain"></div></section><hr>
  <section><h3>S3 Lifecycle Lock</h3><div id="lifecycle"></div></section><hr>
  <section><h3>DynamoDB Query Lock</h3><div id="query"></div></section><hr>
  <section><h3>CloudWatch Alarm Lock</h3><div id="alarm"></div></section><hr>
  <section><h3>Incident Timeline Lock</h3><div id="timeline"></div></section><hr>
  <section><h3>Well-Architected Lock</h3><div id="pillar"></div></section>

<script src="puzzle/sg-lock.js"></script>
<script src="puzzle/cidr-lock.js"></script>
<script src="puzzle/waf-lock.js"></script>
<script src="puzzle/task-lock.js"></script>
<script src="puzzle/chain-lock.js"></script>
<script src="puzzle/lifecycle-lock.js"></script>
<script src="puzzle/query-lock.js"></script>
<script src="puzzle/alarm-lock.js"></script>
<script src="puzzle/timeline-lock.js"></script>
<script src="puzzle/pillar-lock.js"></script>
<script>
new SgLock(document.getElementById('sg'), {
  rules: [
    { protocol: 'TCP', port: '443', source: '0.0.0.0/0', answer: 'allow' },
    { protocol: 'TCP', port: '22', source: '0.0.0.0/0', answer: 'deny' },
    { protocol: 'TCP', port: '22', source: '10.0.0.0/8', answer: 'allow' },
    { protocol: 'TCP', port: '3306', source: '0.0.0.0/0', answer: 'deny' },
    { protocol: 'TCP', port: '3306', source: '10.0.2.0/24', answer: 'allow' },
  ],
  onSubmit() { alert('Security group applied!'); }
});

new CidrLock(document.getElementById('cidr'), {
  vpc: '10.0.0.0/16',
  subnets: [
    { label: 'Public A', options: ['10.0.1.0/24','10.0.1.0/25','10.0.0.0/24'], answer: '10.0.1.0/24' },
    { label: 'Public B', options: ['10.0.2.0/24','10.0.1.0/24','10.0.3.0/24'], answer: '10.0.2.0/24' },
    { label: 'Private A', options: ['10.0.10.0/24','10.0.1.0/24','10.0.20.0/24'], answer: '10.0.10.0/24' },
  ],
  onSubmit() { alert('Subnets created!'); }
});

new WafLock(document.getElementById('waf'), {
  requests: [
    { method: 'GET', path: '/api/data', ip: '10.0.1.5', label: 'legit user', malicious: false },
    { method: 'POST', path: '/admin/login', ip: '203.0.113.50', label: 'brute force', malicious: true },
    { method: 'GET', path: '/api/users', ip: '10.0.1.8', label: 'legit user', malicious: false },
    { method: 'POST', path: '/admin/config', ip: '203.0.113.51', label: 'unauthorized', malicious: true },
  ],
  rules: [
    { match: 'path', options: ['/admin/*','/api/*','/*'], answer: '/admin/*', action: 'block' },
  ],
  onSubmit() { alert('WAF rules deployed!'); }
});

new TaskLock(document.getElementById('task'), {
  taskLimits: { cpu: 1024, memory: 2048 },
  containers: [
    { id: 'web', label: 'Web', icon: '🌐', cpu: 512, memory: 1024 },
    { id: 'sidecar', label: 'Sidecar', icon: '📡', cpu: 256, memory: 512 },
    { id: 'db', label: 'DB Proxy', icon: '🗄️', cpu: 256, memory: 512 },
    { id: 'heavy', label: 'ML Worker', icon: '🧠', cpu: 1024, memory: 2048 },
  ],
  answer: ['web','sidecar','db'],
  onSubmit() { alert('Task registered!'); }
});

new ChainLock(document.getElementById('chain'), {
  items: [
    { id: 'api', label: 'API Gateway', icon: '🌐' },
    { id: 'fn1', label: 'Validate', icon: 'λ' },
    { id: 'sqs', label: 'SQS Queue', icon: '📨' },
    { id: 'fn2', label: 'Process', icon: 'λ' },
    { id: 'ddb', label: 'DynamoDB', icon: '🗄️' },
  ],
  answer: ['api','fn1','sqs','fn2','ddb'],
  onSubmit() { alert('Pipeline deployed!'); }
});

new LifecycleLock(document.getElementById('lifecycle'), {
  stages: [
    { label: 'Standard → IA', min: 30, max: 180, step: 30, answer: 30 },
    { label: 'IA → Glacier', min: 60, max: 365, step: 30, answer: 90 },
    { label: 'Glacier → Delete', min: 180, max: 730, step: 30, answer: 365 },
  ],
  onSubmit() { alert('Lifecycle policy applied!'); }
});

new QueryLock(document.getElementById('query'), {
  table: 'Orders',
  schema: { pk: 'userId', sk: 'orderDate' },
  fields: [
    { label: 'Partition Key (userId)', options: ['user-123','user-456','*'], answer: 'user-123' },
    { label: 'Sort Key Condition', options: ['begins_with 2024','between 2024-01 and 2024-06','= 2024-03-15'], answer: 'begins_with 2024' },
    { label: 'Filter', options: ['status = shipped','amount > 100','none'], answer: 'status = shipped' },
  ],
  onSubmit() { alert('Query returned results!'); }
});

new AlarmLock(document.getElementById('alarm'), {
  fields: [
    { label: 'Metric', options: ['CPUUtilization','NetworkIn','DiskReadOps'], answer: 'CPUUtilization' },
    { label: 'Threshold', options: ['> 50%','> 70%','> 80%','> 90%'], answer: '> 80%' },
    { label: 'Period', options: ['1 min','5 min','15 min'], answer: '5 min' },
    { label: 'Action', options: ['SNS Alert','Auto Scale','Reboot'], answer: 'SNS Alert' },
  ],
  onSubmit() { alert('Alarm created!'); }
});

new TimelineLock(document.getElementById('timeline'), {
  events: [
    { id: 'a', label: '🔔 Alarm fired', time: '10:23' },
    { id: 'b', label: '📋 Runbook triggered', time: '10:25' },
    { id: 'c', label: '🔄 Instance replaced', time: '10:31' },
    { id: 'd', label: '✅ All clear', time: '10:35' },
  ],
  answer: ['a','b','c','d'],
  onSubmit() { alert('Timeline correct!'); }
});

new PillarLock(document.getElementById('pillar'), {
  pillars: ['Security','Reliability','Performance','Cost','Ops Excellence'],
  statements: [
    { text: 'Encrypt data at rest and in transit', answer: 'Security' },
    { text: 'Deploy across multiple Availability Zones', answer: 'Reliability' },
    { text: 'Use caching to reduce latency', answer: 'Performance' },
    { text: 'Right-size instances for your workload', answer: 'Cost' },
    { text: 'Automate runbooks for incident response', answer: 'Ops Excellence' },
  ],
  onSubmit() { alert('All pillars correct!'); }
});
</script>
</body>
</html>
