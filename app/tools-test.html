<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Player Tools Test</title>
<style>
:root{--bg:#0a0e17;--surface:#141b2d;--border:#1e2a45;--text:#e0e6f0;--muted:#7a8ba8;--accent:#3b82f6;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:32px;overflow-y:auto}
h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
section{width:100%;max-width:400px}
hr{border:none;border-top:1px solid var(--border);width:100%;max-width:400px}
</style>
</head>
<body>
  <section>
    <h3>Image Viewer</h3>
    <div id="imgview"></div>
  </section>
  <hr>
  <section>
    <h3>Base64 Decoder</h3>
    <div id="b64"></div>
  </section>
  <hr>
  <section>
    <h3>Binary Converter</h3>
    <div id="binary"></div>
  </section>
  <hr>
  <section>
    <h3>Hex Decoder</h3>
    <div id="hex"></div>
  </section>
  <hr>
  <section>
    <h3>Cipher Wheel</h3>
    <div id="cipher"></div>
  </section>
  <hr>
  <section>
    <h3>Frequency Analyzer</h3>
    <div id="freq"></div>
  </section>
  <hr>
  <section>
    <h3>AWS Service Glossary</h3>
    <div id="glossary"></div>
  </section>

<script src="tools/image-viewer.js"></script>
<script src="tools/base64-decoder.js"></script>
<script src="tools/binary-converter.js"></script>
<script src="tools/hex-decoder.js"></script>
<script src="tools/cipher-wheel.js"></script>
<script src="tools/freq-analyzer.js"></script>
<script src="tools/aws-glossary.js"></script>
<script>
new ImageViewer(document.getElementById('imgview'), { src: '../scenarios/ep0-boot-sequence/assets/start-chamber.png', alt: 'Start Chamber' });
new Base64Decoder(document.getElementById('b64'), { initialValue: 'dW5sb2Nr' });
new BinaryConverter(document.getElementById('binary'), { initialValue: '10110001' });
new HexDecoder(document.getElementById('hex'), { initialValue: '4f50454e' });
new CipherWheel(document.getElementById('cipher'), { initialValue: 'XQORFN' });
new FreqAnalyzer(document.getElementById('freq'), { initialValue: 'THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG' });
new AwsGlossary(document.getElementById('glossary'));
</script>
</body>
</html>
