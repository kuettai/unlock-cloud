<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maze Lock Test</title>
<style>
:root{--bg:#0a0e17;--surface:#141b2d;--border:#1e2a45;--text:#e0e6f0;--muted:#7a8ba8;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:32px;overflow-y:auto}
h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
section{width:100%;max-width:400px}
.result{margin-top:8px;text-align:center;font-size:14px;color:var(--muted);min-height:20px}
hr{border:none;border-top:1px solid var(--border);width:100%;max-width:400px}
</style>
</head>
<body>
  <section>
    <h3>1. Normal — walls visible, goal visible (🚶 icon)</h3>
    <div id="maze1"></div>
    <div class="result" id="r1"></div>
  </section>
  <hr>
  <section>
    <h3>2. Invisible walls — revealed on bump (red), onBump callback</h3>
    <div id="maze2"></div>
    <div class="result" id="r2"></div>
  </section>
  <hr>
  <section>
    <h3>3. Hidden goal + invisible walls — full blind mode</h3>
    <div id="maze3"></div>
    <div class="result" id="r3"></div>
  </section>
  <hr>
  <section>
    <h3>4. Fall mode — hit a wall = back to start + penalty</h3>
    <div id="maze4"></div>
    <div class="result" id="r4"></div>
  </section>

<script src="puzzle/maze-lock.js"></script>
<script>
// 1. Normal
new MazeLock(document.getElementById('maze1'), {
  cols: 4, rows: 4,
  walls: [[0,1,'W'], [1,1,'S'], [1,2,'W'], [0,2,'S'], [2,1,'S'], [2,3,'W']],
  start: { row: 0, col: 0, facing: 'E' },
  goal: { row: 3, col: 3 },
  playerIcon: '🚶',
  onSubmit({steps}) { document.getElementById('r1').textContent = `✅ Solved in ${steps} steps!`; }
});

// 2. Invisible walls — bump reveals them in red, callback fires
let bumps2 = 0;
new MazeLock(document.getElementById('maze2'), {
  cols: 4, rows: 4,
  walls: [[0,1,'W'], [1,1,'S'], [1,2,'W'], [0,2,'S'], [2,1,'S'], [2,3,'W']],
  start: { row: 0, col: 0, facing: 'E' },
  goal: { row: 3, col: 3 },
  showWalls: false,
  onBump() { document.getElementById('r2').textContent = `💥 Bumps: ${++bumps2} (engine would deduct 30s each)`; },
  onSubmit({steps}) { document.getElementById('r2').textContent = `✅ Solved in ${steps} steps, ${bumps2} bumps!`; }
});

// 3. Full blind — no walls, no goal
let bumps3 = 0;
new MazeLock(document.getElementById('maze3'), {
  cols: 5, rows: 5,
  walls: [[0,2,'W'], [0,3,'W'], [1,1,'E'], [1,3,'S'], [1,3,'W'], [2,1,'E'], [2,1,'S'], [2,2,'S'], [2,3,'E'], [3,1,'E'], [3,2,'W'], [3,3,'E']],
  start: { row: 0, col: 0, facing: 'S' },
  goal: { row: 4, col: 3 },
  showWalls: false,
  showGoal: false,
  maxSteps: 30,
  onBump() { document.getElementById('r3').textContent = `💥 Bumps: ${++bumps3} — gather hints first!`; },
  onSubmit({steps}) { document.getElementById('r3').textContent = `✅ Found the exit in ${steps} steps! Bumps: ${bumps3}`; },
  onWrong(msg) { document.getElementById('r3').textContent = '❌ ' + msg; }
});

// 4. Fall mode — hit wall = restart + penalty callback
let falls = 0;
new MazeLock(document.getElementById('maze4'), {
  cols: 4, rows: 4,
  walls: [[0,1,'W'], [1,1,'S'], [1,2,'W'], [0,2,'S'], [2,1,'S'], [2,3,'W']],
  start: { row: 0, col: 0, facing: 'E' },
  goal: { row: 3, col: 3 },
  showWalls: false,
  showGoal: false,
  showSteps: false,
  fallOnBump: true,
  onBump() { document.getElementById('r4').textContent = `💀 Falls: ${++falls} (-30s each!)`; },
  onSubmit({steps}) { document.getElementById('r4').textContent = `✅ Survived in ${steps} steps! Falls: ${falls}`; }
});
</script>
</body>
</html>
