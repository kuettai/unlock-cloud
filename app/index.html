<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<title>Re:Solve</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--surface:#141b2d;--border:#1e2a45;
  --text:#e0e6f0;--muted:#7a8ba8;
  --green:#22c55e;--blue:#3b82f6;--red:#ef4444;--yellow:#eab308;--purple:#a855f7;
  --accent:#3b82f6;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;overflow:hidden;touch-action:manipulation}

#app{display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden}
header{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
#timer{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
#timer.warning{color:var(--yellow)}
#timer.critical{color:var(--red);animation:pulse 1s infinite}
/* Admin panel */
#admin-toggle{position:fixed;bottom:70px;right:10px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;z-index:50}
#admin-panel{display:none;position:fixed;bottom:100px;right:10px;background:var(--surface);border:1px solid var(--red);border-radius:10px;padding:12px;z-index:50;width:260px;max-height:60vh;overflow-y:auto;font-size:12px}
#admin-panel.open{display:block}
#admin-panel h4{color:var(--red);margin-bottom:8px;font-size:13px}
#admin-panel .admin-section{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
#admin-panel .admin-section:last-child{border:none;margin:0;padding:0}
#admin-panel button{display:block;width:100%;padding:6px;margin-bottom:4px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;cursor:pointer;text-align:left}
#admin-panel button:hover{border-color:var(--red)}
#admin-panel .admin-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}

@keyframes pulse{50%{opacity:.5}}

#main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

.screen{display:none}
.screen.active{display:flex;flex-direction:column}

/* Intro */
#intro-screen{position:relative;align-items:center;justify-content:flex-end;text-align:center;padding:0;overflow:hidden}
#intro-cover{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
#intro-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,rgba(10,14,23,0) 10%,rgba(10,14,23,.7) 40%,rgba(10,14,23,.95) 55%,rgba(10,14,23,1) 65%);z-index:1}
#intro-content{position:relative;z-index:2;padding:200px 20px 40px;max-width:440px;width:100%;margin-top:auto}
#intro-screen h2{font-size:22px;margin-bottom:16px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#intro-text{text-align:left;line-height:1.7;color:var(--muted);margin-bottom:24px}
#intro-text p{margin-bottom:10px;font-size:14px}

/* Narrative bar */
#narrative-bar{display:none;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;gap:8px}
#narrative-bar.active{display:flex}
#narrative-bar .nar-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}
#narrative-bar .nar-btn:active{opacity:.7}
#narrative-bar .nar-btn.playing{color:var(--accent);border-color:var(--accent)}
#narrative-panel{display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;max-height:200px;overflow-y:auto;flex-shrink:0}
#narrative-panel.open{display:block}
#narrative-panel p{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:8px}
#narrative-panel .nar-voice{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}

/* Room center */
.room-card{background:var(--surface);border:2px solid var(--green);border-radius:12px;padding:16px;margin-bottom:16px}
.room-title{font-size:18px;font-weight:700;margin-bottom:8px}
.room-desc{font-size:14px;line-height:1.7;color:var(--muted)}
.room-img{width:100%;max-height:400px;object-fit:contain;border-radius:8px;margin-bottom:12px}

/* Room fade-in on first visit */
@keyframes room-fadein{0%{opacity:0;transform:translateX(40px)}40%{opacity:0.3}100%{opacity:1;transform:translateX(0)}}
.room-hidden{opacity:0}
.room-fadein{animation:room-fadein .8s ease-out forwards}

/* Room transition banner */
@keyframes banner-in{0%{background:rgba(10,14,23,.9)}100%{background:rgba(10,14,23,0)}}
@keyframes banner-text-in{0%{opacity:0;transform:translateY(10px)}30%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0}}
.room-banner{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;animation:banner-in 2.1s ease-out forwards}
.room-banner .banner-title{font-size:22px;font-weight:800;color:var(--green);text-shadow:0 0 20px rgba(34,197,94,.4);animation:banner-text-in 2.1s ease-out forwards}
.room-banner .banner-sub{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:2px;animation:banner-text-in 2.1s ease-out forwards}

/* Discovery buttons */
.discoveries{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.discover-btn{background:var(--bg);border:1px dashed var(--muted);border-radius:8px;padding:12px 16px;color:var(--text);font-size:14px;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:10px}
.discover-btn:hover{border-color:var(--accent);color:var(--accent)}
.discover-btn:active{opacity:.7}
.discover-btn .discover-icon{font-size:18px;opacity:.5}
.discover-btn.done{opacity:.3;pointer-events:none;border-style:solid;border-color:var(--border)}
.discover-btn.done .discover-icon{content:'';font-size:14px}
.discover-btn.tool-btn{border-color:var(--accent);border-style:solid;background:rgba(59,130,246,.05)}
.discover-btn.tool-btn:hover{background:rgba(59,130,246,.1)}

/* Reveal animation */
@keyframes card-reveal{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.card-revealed{animation:card-reveal .4s ease-out}

/* Collect animation */
.collect-anim{position:fixed;z-index:100;pointer-events:none;font-size:28px;transition:all .6s cubic-bezier(.2,.8,.3,1);opacity:1}
.collect-anim.fly{transform:scale(.3);opacity:0}

/* Event / penalty banners */
.event-banner{background:linear-gradient(135deg,#1a1a2e,#141b2d);border:1px solid var(--yellow);border-radius:10px;padding:14px;margin-bottom:14px;text-align:center}
.event-banner .ev-title{font-weight:700;color:var(--yellow);margin-bottom:4px}
.event-banner .ev-desc{font-size:14px;color:var(--muted);line-height:1.5}
.penalty-banner{background:#1a0a0a;border:1px solid var(--red);border-radius:10px;padding:14px;margin-bottom:14px;text-align:center}
.penalty-banner .pen-title{font-weight:700;color:var(--red);margin-bottom:4px}
.penalty-banner .pen-desc{font-size:14px;color:var(--muted);line-height:1.5}

/* Slide panels (browse mode) */
.panel-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.panel-overlay.open{opacity:1;pointer-events:auto}
.panel{position:absolute;top:0;bottom:0;width:80%;max-width:340px;background:var(--surface);z-index:11;transition:transform .25s ease;overflow-y:auto;padding:16px}
.panel-left{left:0;transform:translateX(-100%);border-right:1px solid var(--border)}
.panel-left.open{transform:translateX(0)}
.panel-right{right:0;transform:translateX(100%);border-left:1px solid var(--border)}
.panel-right.open{transform:translateX(0)}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.panel-header h3{font-size:15px;font-weight:700}
.panel-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}

/* ===== Map screen ===== */
#map-screen{display:none;flex-direction:column;flex:1;overflow:hidden}
#map-screen.active{display:flex}
#map-top{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--green);display:flex;align-items:center;gap:8px;flex-shrink:0}
#map-top h3{flex:1;font-size:15px;color:var(--green)}
#map-list{flex:1;overflow:auto;padding:16px;position:relative}
#map-list::after{content:'';position:sticky;bottom:0;left:0;right:0;height:40px;display:block;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
#map-list::before{content:'';position:sticky;top:0;left:0;right:0;height:0;display:block;background:linear-gradient(to top,transparent,var(--bg));pointer-events:none;z-index:1}
.map-room{background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;min-width:140px;max-width:180px;flex-shrink:0}
.map-room:active{opacity:.7}
.map-room.current{border-color:var(--green);background:#0d1a0d}
.map-room .room-dot{width:12px;height:12px;border-radius:50%;background:var(--border);flex-shrink:0}
.map-room.current .room-dot{background:var(--green)}
.map-room.unsolved .room-dot{background:var(--yellow)}
.map-room.locked{opacity:.35;pointer-events:none;border-style:dashed}
.map-room.locked .room-dot{background:var(--border)}
.map-room .room-info{flex:1}
.map-room .room-name{font-weight:700;font-size:14px}
.map-room .room-status{font-size:12px;color:var(--muted);margin-top:2px}
.map-room .room-unlock{font-size:11px;color:var(--yellow);margin-top:4px;font-style:italic}
.map-room .room-connects{font-size:11px;color:var(--muted);margin-top:4px}
.map-room .room-connects span{color:var(--green)}
.map-room.current .room-status{color:var(--green)}
.map-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--yellow);color:var(--bg);font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;margin-left:6px;vertical-align:middle}

/* Map tree layout */
.map-node{display:flex;align-items:center}
.map-connector{display:flex;align-items:center;padding:0 4px;color:var(--border)}
.map-connector .line{font-size:16px}
.map-branch{display:flex;flex-direction:column;gap:8px}
.map-branch .map-branch-col{display:flex;align-items:center;border-left:none;border-top:2px solid var(--border);padding:8px 0 0 0}
.map-branch .map-branch-col:first-child{border-top:none;padding-top:0}

/* Isometric map */
.iso-container{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:20px}
.iso-floor{width:500px;height:600px;transform:rotateX(55deg) rotateZ(45deg);transform-style:preserve-3d;position:relative;margin:0 auto;perspective:800px}
.iso-tile{position:absolute;width:120px;height:120px;border:2px solid #1e2a45;border-radius:8px;background:#141b2d;cursor:pointer;transition:all 0.3s;overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;transform-style:preserve-3d}
.iso-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.4;border-radius:6px}
.iso-tile.current{border-color:#3b82f6;box-shadow:0 0 20px rgba(59,130,246,0.4)}
.iso-tile.current img{opacity:0.7}
.iso-tile.explored{border-color:#22c55e}
.iso-tile.explored img{opacity:0.5}
.iso-tile.locked{border-color:#333;opacity:0.3;cursor:default;filter:grayscale(1)}
.iso-tile:active:not(.locked){transform:translateZ(8px);border-color:#f39c12;box-shadow:0 4px 16px rgba(243,156,18,0.3)}
.iso-tile.selected{transform:translateZ(8px);border-color:#f39c12 !important;box-shadow:0 4px 16px rgba(243,156,18,0.4) !important}
.iso-tile .iso-label{position:absolute;bottom:-40px;left:50%;z-index:4;font-size:12px;font-weight:700;color:#fff;text-align:center;background:rgba(10,14,23,0.95);padding:4px 10px;border-radius:4px;border:1px solid #555;transform:rotateZ(-45deg) rotateX(-55deg) translateZ(20px);white-space:nowrap;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8))}
.iso-tile .iso-badge{position:absolute;top:6px;right:6px;z-index:2;background:#e94560;color:#fff;font-size:16px;font-weight:700;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.iso-tile .iso-pin{position:absolute;top:30%;left:30%;z-index:3;display:flex;flex-direction:column;align-items:center;transform:rotateZ(-45deg) rotateX(-55deg);animation:iso-bounce 1.5s ease infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,0.5))}
.iso-pin-head{width:16px;height:16px;background:#e94560;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff}
.iso-pin-stick{width:3px;height:36px;background:#888;border-radius:0 0 2px 2px;margin-top:-2px}
@keyframes iso-bounce{0%,100%{transform:rotateZ(-45deg) rotateX(-55deg) translateY(0)}50%{transform:rotateZ(-45deg) rotateX(-55deg) translateY(-8px)}}
.iso-connector{position:absolute;background:#1e2a45;height:3px;z-index:0;transform-origin:0 50%}
.iso-connector.active{background:#22c55e}
.iso-connector.current-line{background:#3b82f6}
.iso-info{width:360px;min-height:50px;background:#141b2d;border:1px solid #1e2a45;border-radius:10px;padding:12px 16px;text-align:center;margin-top:12px}
.vox-floor{width:600px;height:820px;position:relative;margin:0 auto;padding-bottom:80px}
.vox-tile{position:absolute;width:200px;height:200px;border:none;background:transparent;cursor:pointer;transition:all 0.3s;overflow:visible;padding:0}
.vox-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vox-tile.current{filter:drop-shadow(0 0 8px rgba(59,130,246,0.6))}
.vox-tile.explored{filter:drop-shadow(0 0 6px rgba(34,197,94,0.4))}
.vox-tile.explored img{opacity:0.85}
.vox-tile.locked{opacity:0.3;cursor:default;filter:grayscale(1)}
.vox-tile:active:not(.locked){transform:scale(1.08);filter:drop-shadow(0 0 12px rgba(243,156,18,0.5))}
.vox-tile.selected{transform:scale(1.08);filter:drop-shadow(0 0 12px rgba(243,156,18,0.6)) !important}
.vox-tile .iso-label{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:4;font-size:12px;font-weight:700;color:#fff;text-align:center;background:rgba(10,14,23,0.95);padding:4px 10px;border-radius:4px;border:1px solid #555;white-space:nowrap;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8))}
.vox-tile .iso-badge{position:absolute;top:30%;right:10%;z-index:2;background:#e94560;color:#fff;font-size:16px;font-weight:700;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vox-tile .iso-pin{position:absolute;top:20%;left:40%;z-index:3;font-size:28px;animation:vox-bounce 1.5s ease infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,0.5))}
@keyframes vox-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.vox-connector{position:absolute;background:#1e2a45;height:3px;z-index:0;transform-origin:0 50%}
.vox-connector.active{background:#22c55e}
.vox-connector.current-line{background:#3b82f6}
.iso-info-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
.iso-info-status{font-size:12px;color:#888;margin-bottom:4px}
.iso-info-unlock{font-size:11px;color:#666;font-style:italic;margin-bottom:8px}
.iso-info-actions{font-size:12px;color:#f39c12;margin-bottom:8px}
.iso-info-btn{padding:8px 20px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:13px;font-weight:600;cursor:pointer}

/* ===== Tools screen ===== */
#tools-screen{display:none;flex-direction:column;flex:1;overflow:hidden}
#tools-screen.active{display:flex}
.tool-card{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.tool-card:active{opacity:.7}
.tool-card .tool-room{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tool-card .tool-name{font-size:14px;font-weight:700;color:var(--accent)}
.tool-card .tool-desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.tool-card.locked{opacity:.4;border-style:dashed;cursor:not-allowed}

/* ===== Combine screen (block layout) ===== */
#combine-screen{display:none;flex-direction:column;flex:1;overflow:hidden}
#combine-screen.active{display:flex}
#combine-top{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--accent);display:flex;align-items:center;gap:8px;flex-shrink:0}
#combine-label{font-size:13px;color:var(--muted);flex:1}
#combine-label span{color:var(--accent);font-weight:600}
#combine-panels{display:flex;flex:1;overflow:hidden}
.combine-col{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.combine-col:first-child{border-right:1px solid var(--border)}
.combine-col h4{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.combine-col-red h4{color:var(--red)}
.combine-col-blue h4{color:var(--blue)}

/* Cards */
.card{background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:all .2s}
.card.red{border-color:var(--red)}
.card.blue{border-color:var(--blue)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-title{font-weight:700;font-size:14px}
.card-id{font-size:11px;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:99px}
.card-desc{font-size:13px;line-height:1.5;color:var(--muted);white-space:pre-line}
.card-flavor{font-size:12px;font-style:italic;color:var(--accent);margin-top:6px}
.card.selectable{cursor:pointer;border-style:dashed}
.card.selected{border-style:solid;box-shadow:0 0 12px rgba(59,130,246,.3)}
.card.selected.red{border-color:#fff;box-shadow:0 0 12px rgba(239,68,68,.4)}
.card.selected.blue{border-color:#fff;box-shadow:0 0 12px rgba(59,130,246,.4)}
.card.selectable.dimmed{opacity:.3}

/* Discovery popup */
#discover-popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:center;justify-content:center;padding:24px}
#discover-popup.open{display:flex}
.popup-card{background:var(--surface);border-radius:14px;padding:20px;max-width:340px;width:100%;animation:card-reveal .4s ease-out;max-height:85vh;overflow-y:auto}
.popup-card img{width:100%;max-height:160px;object-fit:contain;border-radius:8px;margin-bottom:12px}
.popup-card .popup-type{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.popup-card .popup-type.red{color:var(--red)}
.popup-card .popup-type.blue{color:var(--blue)}
.popup-card .popup-title{font-size:18px;font-weight:700;margin-bottom:8px}
.popup-card .popup-desc{font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:6px;white-space:pre-line}
.popup-card .popup-flavor{font-size:12px;font-style:italic;color:var(--accent);margin-bottom:16px}
.popup-card .btn{width:100%}

/* Event result popup */
.popup-card.event-result{border:2px solid var(--yellow)}
.popup-card.event-result .popup-type{color:var(--yellow)}
.popup-card .consumed-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.popup-card .consumed-list span{font-size:12px;color:var(--red);display:inline-block;background:rgba(239,68,68,.1);padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0}

/* Puzzle popup */
#puzzle-popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:30;display:none;align-items:center;justify-content:center;padding:24px}
#puzzle-popup.open{display:flex}
.puzzle-popup-card{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:20px;max-width:520px;width:100%;animation:card-reveal .4s ease-out;max-height:85vh;overflow-y:auto}
.puzzle-popup-card h3{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
#puzzle-mount{min-height:100px}

/* Buttons */
.btn{padding:12px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;transition:opacity .2s}
.btn:active{opacity:.7}
.btn:disabled{opacity:.4}
.btn-primary{background:var(--accent)}
.btn-full{width:100%}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-hint{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.btn-combine{background:var(--accent)}
.btn-cancel{background:var(--surface);border:1px solid var(--border);color:var(--muted)}

/* Bottom bar */
#bottom-bar{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:8px}
.tab-btn{flex:1;padding:12px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);background:var(--surface);border:1px solid var(--border);position:relative;transition:all .2s}
.tab-btn:active{opacity:.7}
.tab-btn.glow{animation:btn-glow 1.5s ease infinite;border-color:var(--green);color:var(--green)}
@keyframes btn-glow{0%,100%{box-shadow:0 0 4px rgba(34,197,94,.3)}50%{box-shadow:0 0 14px rgba(34,197,94,.6)}}
.tab-btn .badge{position:absolute;top:-4px;right:calc(50% - 20px);background:var(--accent);color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tab-btn.red-tab .badge{background:var(--red)}
.tab-btn.blue-tab .badge{background:var(--blue)}

/* Room unlock notification */
.room-unlock-bar{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(234,179,8,.1));border-bottom:1px solid var(--green);padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transform:translateY(-100%);animation:slide-down .4s ease forwards}
.room-unlock-bar .unlock-icon{font-size:20px}
.room-unlock-bar .unlock-text{flex:1;font-size:13px;font-weight:600;color:var(--green)}
.room-unlock-bar .unlock-sub{font-size:11px;color:var(--muted)}
.room-unlock-bar.dismiss{animation:slide-up .3s ease forwards}
@keyframes slide-down{to{transform:translateY(0)}}
@keyframes slide-up{to{transform:translateY(-100%)}}
.tab-btn .badge-map{position:absolute;top:-6px;right:-6px;background:var(--green);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 4px;display:flex;align-items:center;justify-content:center;animation:badge-pulse 1.5s ease infinite}
@keyframes badge-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* Puzzle inputs */
.code-entry{display:flex;gap:8px;margin-top:12px}
.code-entry input{flex:1;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-family:monospace}
.code-entry input:focus{outline:none;border-color:var(--accent)}
.hidden-input{display:flex;gap:8px;margin-top:12px}
.hidden-input input{width:80px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;text-align:center;font-family:monospace}
.tool-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px}
.tool-box label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.tool-box input{width:100%;padding:8px;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:14px}
.tool-box .tool-output{margin-top:8px;padding:8px;background:var(--surface);border-radius:6px;font-family:monospace;font-size:14px;color:var(--green);min-height:32px}

.hint-box{background:#1a1a2e;border:1px solid var(--purple);border-radius:8px;padding:12px;margin-top:12px;font-size:14px;color:var(--purple)}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:12px 20px;border-radius:8px;font-size:14px;color:var(--text);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:20}
#toast.show{opacity:1}
#toast.penalty{border-color:var(--red);color:var(--red)}

#end-screen{align-items:center;justify-content:flex-start;text-align:center;padding:0;overflow-y:auto;background-size:cover;background-position:center top;background-repeat:no-repeat}
#end-screen h2{font-size:24px;margin-bottom:8px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#end-screen .stars{font-size:36px;margin:16px 0}
#end-bg{display:none}
#end-overlay{display:none}
#end-content{padding:24px 20px 100px;max-width:440px;width:100%}
#end-content>*{background:rgba(10,14,23,.8);border-radius:12px;padding:20px;margin-bottom:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.score-table{text-align:left;max-width:280px;margin:24px auto}
.score-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.score-row .label{color:var(--muted)}

@keyframes flash-red{0%{background:var(--bg)}50%{background:#2a0a0a}100%{background:var(--bg)}}
.penalty-flash{animation:flash-red .4s}
</style>
</head>

<script>
const _params = new URLSearchParams(location.search);
let SCENARIO_BASE = _params.get('scenario') || null;
const EVENT_ID = _params.get('game_id') || _params.get('event') || null;
const _gmParam = _params.get('gameMode');
if (_gmParam) localStorage.setItem('gameMode', _gmParam);

// Resolve scenario from game_id if not in URL (requires backend scenario_id support)
if (!SCENARIO_BASE && EVENT_ID) {
  try {
    const _xhr = new XMLHttpRequest();
    _xhr.open('GET', `https://9ean11i2e8.execute-api.ap-southeast-5.amazonaws.com/prod/games/${EVENT_ID}`, false);
    _xhr.send();
    if (_xhr.status === 200) {
      const _gd = JSON.parse(_xhr.responseText);
      if (_gd.scenario_id) SCENARIO_BASE = '../scenarios/' + _gd.scenario_id;
    }
  } catch {}
}
if (!SCENARIO_BASE) SCENARIO_BASE = '../scenarios/aws/ep0-boot-sequence';

const ASSET_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? SCENARIO_BASE
  : 'https://d37w3py52wsl8r.cloudfront.net/' + SCENARIO_BASE.replace(/^\.\.\//, '');
const engine = new GameEngine(ASSET_BASE);
window.engine = engine;
const leaderboard = new LeaderboardClient();
const GUEST_MODE = new URLSearchParams(location.search).get('mode') === 'guest';
engine.onLeaderboardEvent = (event, payload) => {
  if (GUEST_MODE) return;
  leaderboard.push(event, payload);
  if (event === 'game_complete') leaderboard.flush().then(res => { if (res && res.timer) engine.syncTimer(res.timer); });
};
let combineMode = false;
let selectedCards = [];

// ── SFX System (Web Audio API) ──
const sfxCtx = { ac: null };
function _ac() { if (!sfxCtx.ac) sfxCtx.ac = new (window.AudioContext || window.webkitAudioContext)(); return sfxCtx.ac; }
function _tone(freq, dur, type, vol) {
  const ac = _ac(); const o = ac.createOscillator(); const g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
const SFX = {
  discover()  { _tone(600, 0.1, 'sine'); setTimeout(() => _tone(800, 0.15, 'sine'), 80); },
  solve()     { _tone(523, 0.1, 'sine'); setTimeout(() => _tone(659, 0.1, 'sine'), 100); setTimeout(() => _tone(784, 0.2, 'sine'), 200); },
  wrong()     { _tone(200, 0.15, 'square', 0.1); setTimeout(() => _tone(150, 0.25, 'square', 0.1), 120); },
  lore()      { _tone(440, 0.15, 'sine'); setTimeout(() => _tone(554, 0.12, 'sine'), 100); setTimeout(() => _tone(659, 0.12, 'sine'), 200); setTimeout(() => _tone(880, 0.3, 'sine'), 300); },
  unlock()    { _tone(400, 0.08, 'triangle'); setTimeout(() => _tone(500, 0.08, 'triangle'), 70); setTimeout(() => _tone(700, 0.15, 'triangle'), 140); },
  warning()   { _tone(800, 0.1, 'square', 0.12); setTimeout(() => _tone(600, 0.1, 'square', 0.12), 150); setTimeout(() => _tone(800, 0.1, 'square', 0.12), 300); },
  complete()  { [523,659,784,1047].forEach((f,i) => setTimeout(() => _tone(f, 0.3, 'sine', 0.12), i*150)); },
  pour()      { _tone(300, 0.4, 'sine', 0.06); },
  fall()      { _tone(400, 0.08, 'sawtooth', 0.1); setTimeout(() => _tone(200, 0.3, 'sawtooth', 0.08), 80); },
  bump()      { _tone(150, 0.15, 'square', 0.08); },
};
let timerInterval = null;
let currentPuzzleId = null;
let activePuzzlePopupId = null;
let lastEvent = null;
let lastPenalty = null;
let visitedRooms = new Set();
let lastKnownRoomCount = 0;
let lastPopupCard = null;

let currentAudio = null;
let currentNarrativeKey = null; // 'intro' or 'ending_success'

function playVoice(file) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentAudio = new Audio(`${ASSET_BASE}/assets/voice/${file}`);
  currentAudio.play().catch(() => {});
  document.getElementById('nar-play-btn').classList.add('playing');
  currentAudio.onended = () => {
    document.getElementById('nar-play-btn').classList.remove('playing');
  };
}
function stopVoice() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.getElementById('nar-play-btn').classList.remove('playing');
}

function setNarrative(key) {
  currentNarrativeKey = key;
  document.getElementById('narrative-bar').classList.add('active');
  document.getElementById('narrative-panel').classList.remove('open');
  renderNarrativeText();
}

function replayNarrative() {
  if (!currentNarrativeKey) return;
  const fileMap = { intro: 'intro.wav', ending_success: 'ending_success.wav' };
  const file = fileMap[currentNarrativeKey];
  if (file) playVoice(file);
}

function toggleNarrativeText() {
  const panel = document.getElementById('narrative-panel');
  panel.classList.toggle('open');
}

function renderNarrativeText() {
  const panel = document.getElementById('narrative-panel');
  const n = engine.narrative;
  let segments = [];
  const voices = n.voices || {};

  if (currentNarrativeKey === 'intro' && n.intro) {
    segments = n.intro.segments || [{ text: (n.intro.text || []).join(' ') }];
  } else if (currentNarrativeKey === 'ending_success' && n.ending?.success) {
    segments = n.ending.success.segments || [{ text: (n.ending.success.text || []).join(' ') }];
  }

  panel.innerHTML = segments.map(s => {
    const voice = voices[s.voice];
    const label = voice ? `<span class="nar-voice">${s.voice}</span> ` : '';
    return `<p>${label}${s.text || (s.ssml || '').replace(/<[^>]+>/g, '')}</p>`;
  }).join('');
}

const ADMIN = new URLSearchParams(location.search).get('admin') === 'true';

(async () => {
  await engine.load();
  engine.onUpdate = () => { renderGame(); renderAdmin(); };
  window._cafeOrderBadgeUpdate = () => {
    const pending = typeof CafeOrderLock !== 'undefined' ? CafeOrderLock.getPending() : 0;
    setBadge('badge-cafe', pending);
  };
  if (GUEST_MODE) {
    document.getElementById('player-name-input').style.display = 'none';
    document.getElementById('guest-badge').style.display = '';
  }
  initAdmin();
  if (engine.restoreState() && engine.startTime && !engine.finished) {
    if (!GUEST_MODE && engine.uuid) { leaderboard.gameId = EVENT_ID; leaderboard.uuid = engine.uuid; leaderboard.startPeriodicFlush(10000); }
    showScreen('game-screen');
    document.getElementById('timer').style.visibility = 'visible';
    lastKnownRoomCount = engine.unlockedRooms.length;
    timerInterval = setInterval(updateTimer, 1000);
    setNarrative('intro');
    renderGame();
    showToast('Game restored', false);
  } else if (engine.restoreState() && engine.finished) {
    showScreen('game-screen');
    showEndScreen();
  } else {
    renderIntro();
    showScreen('intro-screen');
    playVoice('intro.wav');
  }

  // Prevent Back button from leaving the game
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    history.pushState(null, '', location.href);
  });
})();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('bottom-bar').style.display = id === 'game-screen' ? 'flex' : 'none';
  document.getElementById('main').style.display = id === 'game-screen' || id === 'intro-screen' || id === 'end-screen' ? '' : 'none';
}

function renderIntro() {
  const intro = engine.narrative.intro;
  const el = document.getElementById('intro-text');
  const segments = intro.segments || [{ text: (intro.text || []).join(' ') }];
  el.innerHTML = segments.map(s => `<p>${s.text || (s.ssml || '').replace(/<[^>]+>/g, '')}</p>`).join('');
  document.querySelector('#intro-screen h2').textContent = `Episode ${engine.meta.episode}: ${engine.meta.title}`;
  document.getElementById('intro-cover').src = `${ASSET_BASE}/assets/cover.png`;
  document.getElementById('intro-cover').alt = engine.meta.title;
  document.getElementById('start-btn').textContent = engine.meta.start_button || 'Start';
}

async function startGame() {
  const nameInput = document.getElementById('player-name-input');
  const playerName = (nameInput.value || '').trim();
  if (!GUEST_MODE && !playerName) { showToast('Please enter your name.', true); return; }
  engine.playerName = playerName || 'Anonymous';

  if (!GUEST_MODE) {
    document.getElementById('start-btn').disabled = true;
    const reg = await leaderboard.register(playerName, engine.meta.id, EVENT_ID);
    if (reg && reg._rejected && reg.gameState === 'FULL') {
      document.getElementById('start-btn').disabled = false;
      document.getElementById('guest-badge').style.display = '';
      showToast('Event is full. Starting as guest — your score won\'t appear on the leaderboard.', true);
      // Fall through as guest — skip all leaderboard interaction
    } else if (!reg || !reg.uuid) {
      document.getElementById('start-btn').disabled = false;
      if (EVENT_ID) {
        showToast('Could not connect to server. Try again.', true);
        return;
      }
      // No event — just start as guest silently
    } else {
      engine.uuid = reg.uuid;
      leaderboard.uuid = reg.uuid;

      // Check if event is ready to start (only for event-based play)
      if (!reg.ready && EVENT_ID) {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('player-name-input').style.display = 'none';
        document.getElementById('waiting-state').style.display = 'block';
        await pollUntilReady();
      }
      if (reg.timer) engine.syncTimer(reg.timer);
      leaderboard.startPeriodicFlush(10000);
    }
  }

  engine.clearSave();
  showScreen('game-screen');
  engine.start();
  document.getElementById('timer').style.visibility = 'visible';
  lastKnownRoomCount = engine.unlockedRooms.length;
  setNarrative('intro');
  timerInterval = setInterval(updateTimer, 1000);
  renderGame();
}

async function pollUntilReady() {
  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    const res = await leaderboard.status();
    if (res && res.ready) {
      if (res.timer) engine.syncTimer(res.timer);
      return;
    }
  }
}

function updateTimer() {
  let remaining;
  if (engine.serverTimer && engine.serverTimerAt) {
    // Parse server timer "MM:SS" and subtract local elapsed since last sync
    const parts = engine.serverTimer.split(':');
    const serverSecs = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    const localElapsed = Math.floor((Date.now() - engine.serverTimerAt) / 1000);
    remaining = serverSecs - localElapsed;
  } else {
    remaining = engine.getRemainingSeconds();
  }
  const abs = Math.abs(remaining);
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  const el = document.getElementById('timer');
  const neg = remaining < 0 ? '-' : '';
  el.textContent = `${neg}${m}:${String(s).padStart(2, '0')}`;
  el.className = remaining <= 0 ? 'critical' : remaining <= 60 ? 'critical' : remaining <= 180 ? 'warning' : '';
  if (remaining <= 0 && !engine._timerExpired) {
    engine._timerExpired = true;
    showToast('⏱️ Time expired! You can keep playing but your score will reflect the overtime.', true);
  }
  if (engine.finished) clearInterval(timerInterval);
}

// --- Browse panels ---
function togglePanel() {}
function closeAllPanels() {}

// --- Render game ---
function renderGame() {
  if (engine.finished) { showEndScreen(); return; }
  const room = engine.getActiveRoom();
  const items = engine.getInventoryItems();
  const objects = engine.getCurrentRoomObjects();

  // Center room
  if (room) {
    let img = room.image ? `<img class="room-img" src="${ASSET_BASE}/${room.image}" alt="${room.title}" onerror="this.style.display='none'">` : '';
    let extra = '';
    if (room.hidden_elements && !engine.solvedPuzzles.has(room.puzzle_ref)) {
      const hp = engine.puzzles[room.puzzle_ref] || {};
      const hPlaceholder = hp.placeholder || 'Enter number';
      const hButton = hp.button_label || 'Submit';
      extra += `<div class="hidden-input"><input type="number" id="hidden-input-${room.id}" placeholder="${hPlaceholder}" inputmode="numeric"><button class="btn btn-sm btn-primary" onclick="tryHidden(${room.id})">${hButton}</button></div>`;
    }
    if (room.puzzle_ref && engine.puzzles[room.puzzle_ref] && engine.puzzles[room.puzzle_ref].type === 'code_entry' && !engine.solvedPuzzles.has(room.puzzle_ref)) {
      const p = engine.puzzles[room.puzzle_ref];
      if (p.puzzle_ui === 'word_lock') {
        extra += `<div id="word-lock-mount" data-puzzle="${room.puzzle_ref}"></div>`;
      } else {
        extra += `<div class="code-entry"><input type="text" id="code-input-${room.puzzle_ref}" placeholder="Enter code..." autocomplete="off"><button class="btn btn-sm btn-primary" onclick="tryCode('${room.puzzle_ref}')">Submit</button></div>`;
      }
      if (p.tools_available && p.tools_available.includes('base64_decoder')) {}
    }
    const container = document.getElementById('room-container');
    const roomChanged = container.dataset.roomId !== String(room.id);

    // Banners (always update)
    let banners = '';
    if (lastEvent) banners += `<div class="event-banner"><div class="ev-title">${lastEvent.title}</div><div class="ev-desc">${lastEvent.description}</div></div>`;
    if (lastPenalty) banners += `<div class="penalty-banner"><div class="pen-title">${lastPenalty.title}</div><div class="pen-desc">${lastPenalty.description}</div></div>`;
    const existingBanners = container.querySelectorAll('.event-banner,.penalty-banner');
    existingBanners.forEach(b => b.remove());
    if (banners) container.insertAdjacentHTML('afterbegin', banners);

    if (roomChanged) {
      container.dataset.roomId = String(room.id);
      if (visitedRooms.has(room.id)) {
        showRoomBanner(room.title);
      } else {
        visitedRooms.add(room.id);
        showRoomBanner(room.title);
      }
      let roomHtml = banners;
      if (room.image) {
        img = `<img class="room-img" src="${ASSET_BASE}/${room.image}" alt="${room.title}" onload="this.parentElement.style.opacity=1" onerror="this.style.display='none';this.parentElement.style.opacity=1">`;
        roomHtml += `<div class="room-card" style="opacity:0;transition:opacity 1.5s ease">${img}<div class="room-title">${room.title}</div><div class="room-desc">${room.description}</div>${extra}</div>`;
      } else {
        roomHtml += `<div class="room-card room-fadein">${img}<div class="room-title">${room.title}</div><div class="room-desc">${room.description}</div>${extra}</div>`;
      }

      roomHtml += buildDiscoveryHtml();

      container.innerHTML = roomHtml;
      mountWordLock();
    } else {
      // Same room — only update discovery buttons
      const existingDisc = container.querySelector('.discoveries');
      if (existingDisc) existingDisc.remove();
      const discHtml = buildDiscoveryHtml();
      if (discHtml) container.insertAdjacentHTML('beforeend', discHtml);
    }

    currentPuzzleId = room.puzzle_ref || null;
  }

  // Interact badge (items + objects count)
  setBadge('badge-interact', items.length + objects.length);

  // Notify when new rooms unlock
  const roomCount = engine.unlockedRooms.length;
  if (roomCount > lastKnownRoomCount && lastKnownRoomCount > 0) {
    const newRooms = engine.unlockedRooms.slice(lastKnownRoomCount);
    newRooms.forEach(cardId => {
      const roomDef = engine.rooms.find(r => r.card_id === cardId);
      const card = engine.cards[cardId];
      showRoomUnlock(roomDef?.name || card?.title || 'Unknown Area');
    });
  }
  lastKnownRoomCount = roomCount;

  // If combine screen is open, update it too
  if (combineMode) renderCombineCards();

  // Show toasts for auto-revealed items/lore
  if (engine.revealQueue && engine.revealQueue.length) {
    const queue = engine.revealQueue.splice(0);
    queue.forEach((card, i) => {
      setTimeout(() => {
        const icon = card.type === 'item' ? '🔴' : '🟣';
        const loreLabel = engine.meta.lore_label || 'Memory Fragment';
        const label = card.type === 'item' ? 'Item acquired' : loreLabel;
        showToast(`${icon} ${label}: ${card.title}`, false);
        if (card.type === 'lore') SFX.lore(); else SFX.discover();
      }, i * 800);
    });
  }
}

function renderCard(card, selectable) {
  const selected = selectedCards.includes(card.id);
  // Dim unselected cards of same type when one is already picked
  let dimmed = false;
  if (selectable && !selected) {
    const sameTypePicked = selectedCards.some(sid => engine.cards[sid]?.type === card.type);
    if (sameTypePicked) dimmed = true;
  }
  const cls = `card ${card.color} ${selectable ? 'selectable' : ''} ${selected ? 'selected' : ''} ${dimmed ? 'dimmed' : ''}`;
  const onclick = selectable ? `onclick="toggleSelect(${card.id})"` : '';
  const flavor = card.flavor_text ? `<div class="card-flavor">${card.flavor_text}</div>` : '';
  const img = card.image ? `<img style="width:100%;max-height:60px;object-fit:contain;border-radius:6px;margin-bottom:8px" src="${ASSET_BASE}/${card.image}" onerror="this.style.display='none'">` : '';
  return `<div class="${cls}" ${onclick}>${img}<div class="card-header"><span class="card-title">${card.title}</span><span class="card-id">#${card.id}</span></div><div class="card-desc">${card.description}</div>${flavor}</div>`;
}

function setBadge(id, n) {
  const el = document.getElementById(id);
  if (n > 0) { el.style.display = 'flex'; el.textContent = n; } else el.style.display = 'none';
}

function buildDiscoveryHtml() {
  const all = engine.getAllDiscoveriesInRoom();
  const active = all.filter(d => !d.done && d.available);
  const done = all.filter(d => d.done);
  if (!active.length && !done.length) return '';
  let html = '<div class="discoveries">';
  active.forEach(d => {
    const puzzle = d.puzzle ? engine.puzzles[d.puzzle] : null;
    const isTool = puzzle && puzzle.type === 'tool';
    const isNpc = isTool && puzzle.ui === 'npc-dialog';
    const icon = isNpc ? (puzzle.config?.portrait || '🧑') : isTool ? '🔧' : d.puzzle ? '🔒' : '👁';
    const cls = isTool ? 'discover-btn tool-btn' : 'discover-btn';
    let subtitle = '';
    if (d.requires_item) {
      const reqs = Array.isArray(d.requires_item) ? d.requires_item : [d.requires_item];
      const names = reqs.map(id => engine.cards[id]?.title || '').filter(Boolean);
      if (names.length) subtitle = `<div style="font-size:10px;color:var(--green);margin-top:2px;opacity:.7">🔓 ${names.join(' + ')}</div>`;
    }
    html += `<button class="${cls}" onclick="discover(${d.card_id},'${d.puzzle||''}')"><span class="discover-icon">${icon}</span><div>${d.label}${subtitle}</div></button>`;
  });
  done.forEach(d => {
    const card = engine.cards[d.card_id];
    const name = card ? ` — ${card.title}` : '';
    html += `<button class="discover-btn done"><span class="discover-icon">✓</span>${d.label}${name}</button>`;
  });
  const locked = all.filter(d => !d.done && !d.available);
  locked.forEach(d => {
    let missing = '';
    const uid = 'lock-' + d.card_id;
    if (d.requires_item) {
      const reqs = Array.isArray(d.requires_item) ? d.requires_item : [d.requires_item];
      const missingItems = reqs.filter(r => !engine.inventory.includes(r) && !engine.visibleCards.has(r) && !engine.discoveredCards.has(r) && !(engine.revealedCards && engine.revealedCards.has(r)));
      if (missingItems.length) {
        const names = missingItems.map(id => engine.cards[id]?.title || `#${id}`).join(', ');
        const revealed = engine['_lockRevealed_' + d.card_id];
        missing = `<div id="${uid}" style="${revealed ? '' : 'display:none;'}font-size:11px;color:var(--red);margin-top:4px">Missing: ${names}</div>`;
      }
    }
    const revealed = engine['_lockRevealed_' + d.card_id];
    const onclick = revealed ? '' : `onclick="if(!engine['_lockRevealed_${d.card_id}']){engine['_lockRevealed_${d.card_id}']=true;engine.penaltySeconds+=15;showToast('⏱️ -15 seconds',true);var el=document.getElementById('${uid}');if(el)el.style.display='block'}"`;
    html += `<button class="discover-btn" style="opacity:.5;cursor:pointer" ${onclick}><span class="discover-icon">🔒</span><div>${d.label}${missing}</div></button>`;
  });
  html += '</div>';
  return html;
}

// --- Combine mode ---
function enterCombineMode() {
  combineMode = true;
  selectedCards = [];
  document.getElementById('main').style.display = 'none';
  document.getElementById('bottom-bar').style.display = 'none';
  document.getElementById('combine-screen').classList.add('active');
  renderCombineCards();
  updateCombineLabel();
}

function cancelCombine() {
  combineMode = false;
  selectedCards = [];
  document.getElementById('combine-screen').classList.remove('active');
  document.getElementById('main').style.display = '';
  document.getElementById('bottom-bar').style.display = 'flex';
}

function renderCombineCards() {
  const items = engine.getInventoryItems();
  const objects = engine.getCurrentRoomObjects();
  const consumed = engine.getConsumedCards();
  const consumedItems = consumed.filter(c => c.type === 'item');
  const consumedObjects = consumed.filter(c => c.type === 'object');

  let itemsHtml = items.length ? items.map(c => renderCard(c, true)).join('') : '<p style="color:var(--muted);font-size:13px;text-align:center">No items</p>';
  if (consumedItems.length) itemsHtml += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:8px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Used</div>' + consumedItems.map(c => renderConsumedCard(c)).join('') + '</div>';

  let objectsHtml = objects.length ? objects.map(c => renderCard(c, true)).join('') : '<p style="color:var(--muted);font-size:13px;text-align:center">No objects</p>';
  if (consumedObjects.length) objectsHtml += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:8px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Used</div>' + consumedObjects.map(c => renderConsumedCard(c)).join('') + '</div>';

  document.getElementById('combine-items').innerHTML = itemsHtml;
  document.getElementById('combine-objects').innerHTML = objectsHtml;
}

function renderConsumedCard(card) {
  return `<div class="card ${card.color}" style="opacity:.35;pointer-events:none"><div class="card-header"><span class="card-title">${card.title}</span><span class="card-id">#${card.id}</span></div><div class="card-desc">${card.description}</div></div>`;
}

function toggleSelect(id) {
  const card = engine.cards[id];
  if (!card) return;
  const idx = selectedCards.indexOf(id);
  if (idx >= 0) { selectedCards.splice(idx, 1); }
  else {
    // Only one red + one blue allowed
    const isRed = card.type === 'item';
    selectedCards = selectedCards.filter(sid => engine.cards[sid]?.type === (isRed ? 'object' : 'item'));
    selectedCards.push(id);
  }
  updateCombineLabel();
  renderCombineCards();
}

function updateCombineLabel() {
  const label = document.getElementById('combine-label');
  const btn = document.getElementById('combine-btn');
  if (selectedCards.length === 0) { label.innerHTML = 'Select one Item + one Object to interact'; btn.disabled = true; }
  else if (selectedCards.length === 1) { label.innerHTML = `<span>${engine.cards[selectedCards[0]].title}</span> + ?`; btn.disabled = true; }
  else { label.innerHTML = `<span>${engine.cards[selectedCards[0]].title}</span> + <span>${engine.cards[selectedCards[1]].title}</span>`; btn.disabled = false; }
}

function doCombine() {
  if (selectedCards.length !== 2) return;
  lastEvent = null; lastPenalty = null;
  const result = engine.tryCombination(selectedCards[0], selectedCards[1]);
  const consumed = engine.lastConsumed;
  cancelCombine();
  if (result) {
    if (result.type === 'penalty') {
      SFX.wrong();
      lastPenalty = result;
      showToast(result.description, true);
      document.getElementById('main').classList.add('penalty-flash');
      setTimeout(() => document.getElementById('main').classList.remove('penalty-flash'), 400);
      setTimeout(() => { lastPenalty = null; renderGame(); }, 3000);
    } else if (result.type === 'nothing') {
      showToast(result.description, false);
    } else if (result.type === 'event') {
      SFX.solve();
      showEventPopup(result, consumed);
    } else if (result.type === 'item') {
      showDiscoverPopup(result);
    }
  }
  renderGame();
}

function showEventPopup(card, consumed) {
  const popup = document.getElementById('discover-popup');
  const img = document.getElementById('popup-img');
  img.style.display = 'none';
  document.getElementById('popup-type').textContent = 'Success';
  document.getElementById('popup-type').className = 'popup-type';
  document.getElementById('popup-type').style.color = 'var(--yellow)';
  document.getElementById('popup-title').textContent = card.title;
  document.getElementById('popup-desc').textContent = card.description;
  const flavor = document.getElementById('popup-flavor');
  if (consumed.length) {
    flavor.style.display = '';
    flavor.innerHTML = '<div class="consumed-list">Used: ' + consumed.map(c => `<span>${c.title}</span>`).join('') + '</div>';
  } else {
    flavor.style.display = 'none';
  }
  document.querySelector('.popup-card').classList.add('event-result');
  popup.classList.add('open');
}

// --- Discovery ---
function discover(cardId, puzzleId) {
  if (puzzleId) {
    const puzzle = engine.puzzles[puzzleId];
    if (puzzle && puzzle.type === 'tool') {
      // Reveal the tool card on first use (triggers reveals without consuming)
      if (cardId > 0) engine.revealCard(cardId);
      // Time-cost tools deduct time on first use
      const costKey = `_used_${puzzleId}`;
      const cost = puzzle.config?.time_cost_seconds;
      if (cost && !engine[costKey]) {
        engine[costKey] = true;
        if (!engine.timeInvested) engine.timeInvested = 0;
        engine.timeInvested += cost;
        showToast(`⏱️ ${puzzle.description} activated (−${Math.floor(cost/60)} min)`, false);
      }
      showPuzzlePopup(puzzleId, cardId);
      return;
    }
    showPuzzlePopup(puzzleId, cardId);
    return;
  }
  const prevInv = [...engine.inventory];
  const card = engine.discoverCard(cardId);
  if (!card) { renderGame(); return; }
  const consumed = prevInv.filter(id => !engine.inventory.includes(id));
  if (consumed.length) {
    const names = consumed.map(id => engine.cards[id]?.title || '').filter(Boolean).join(', ');
    if (names) setTimeout(() => showToast(`Used: ${names}`, false), 300);
  }
  if (card.type === 'location') {
    SFX.unlock();
    renderGame();
    return;
  }
  SFX.discover();
  showDiscoverPopup(card);
}

function showPuzzlePopup(puzzleId, awardCardId) {
  const puzzle = engine.puzzles[puzzleId];
  if (!puzzle) return;
  activePuzzlePopupId = puzzleId;
  const popup = document.getElementById('puzzle-popup');
  const mount = document.getElementById('puzzle-mount');
  document.getElementById('puzzle-popup-title').textContent = puzzle.description;
  document.getElementById('puzzle-hint-box').style.display = 'none';
  document.getElementById('puzzle-hint-btn').style.display = puzzle.type === 'tool' ? 'none' : '';
  mount.innerHTML = '';

  const onSolve = () => {
    popup.classList.remove('open');
    engine.solvedPuzzles.add(puzzleId);
    if (engine.onLeaderboardEvent) engine.onLeaderboardEvent('puzzle_solved', { puzzleId });
    SFX.solve();
    const successCard = puzzle.success_card || awardCardId;
    if (successCard !== awardCardId) engine.discoverCard(awardCardId);
    const prevInv = [...engine.inventory];
    const card = engine.discoverCard(successCard);
    const consumed = prevInv.filter(id => !engine.inventory.includes(id));
    if (consumed.length) {
      const names = consumed.map(id => engine.cards[id]?.title || '').filter(Boolean).join(', ');
      if (names) setTimeout(() => showToast(`Used: ${names}`, false), 300);
    }
    if (!card && engine.cards[successCard]?.is_ending) {
      engine.finished = true; engine.completed = true; engine.endTime = Date.now();
    }
    if (card && !card.is_ending) showDiscoverPopup(card);
    renderGame();
  };
  const onFail = (msg) => { SFX.wrong(); showToast(msg || 'Wrong. Try again.', true); };
  const cfg = engine.getPuzzleConfig(puzzleId);

  if (puzzle.ui === 'sequence-lock') {
    new SequenceLock(mount, {
      sequence: cfg.sequence, mode: cfg.mode || 'flash',
      flashMs: cfg.flashMs || 400, gapMs: cfg.gapMs || 200,
      onSubmit(correct) { correct ? onSolve() : onFail('Wrong sequence. Try again.'); }
    });
  } else if (puzzle.ui === 'jigsaw-lock') {
    new JigsawLock(mount, {
      cols: cfg.cols || 3, rows: cfg.rows || 3, tiles: cfg.tiles,
      revealCorrect: cfg.revealCorrect !== false,
      onSubmit() { onSolve(); }
    });
  } else if (puzzle.ui === 'wire-lock') {
    new WireLock(mount, {
      wires: cfg.wires, sockets: cfg.sockets, solution: cfg.solution,
      submitLabel: cfg.submitLabel,
      falseOutputs: cfg.falseOutputs || [],
      onSubmit() { onSolve(); },
      onWrong(msg) { onFail(msg); }
    });
  } else if (puzzle.ui === 'morse-lock') {
    new MorseLock(mount, {
      answer: cfg.answer, showReference: cfg.showReference !== false,
      onSubmit() { onSolve(); }
    });
  } else if (puzzle.ui === 'base64-decoder') {
    new Base64Decoder(mount);
    // Tool popup — no solve, just close manually
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn btn-primary';
    closeBtn.style.cssText = 'width:100%;margin-top:12px';
    closeBtn.textContent = 'Close';
    closeBtn.onclick = () => popup.classList.remove('open');
    mount.appendChild(closeBtn);
  } else if (puzzle.ui === 'log-lock') {
    const rawLines = cfg.lines || [];
    const lines = rawLines[0]?.text !== undefined
      ? rawLines
      : rawLines.map((text, i) => ({ text, correct: (cfg.correct_lines || []).includes(i) }));
    new LogLock(mount, {
      lines,
      prompt: cfg.prompt || 'Select the lines containing critical data',
      onSubmit() { onSolve(); }
    });
  } else if (puzzle.ui === 'terminal-lock') {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family:monospace;padding:16px 0;max-width:400px;margin:0 auto';
    const prompt = document.createElement('div');
    prompt.style.cssText = 'color:var(--green);font-size:14px;margin-bottom:12px;white-space:pre-wrap';
    prompt.textContent = cfg.prompt || '>';
    wrap.appendChild(prompt);
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.style.cssText = 'width:100%;padding:10px;background:#0c0c0c;border:1px solid var(--border);border-radius:6px;color:var(--green);font-family:monospace;font-size:14px;margin-bottom:12px';
    input.placeholder = 'Type your answer...';
    wrap.appendChild(input);
    const status = document.createElement('div');
    status.style.cssText = 'font-size:13px;color:var(--muted);text-align:center;min-height:18px;margin-bottom:12px';
    wrap.appendChild(status);
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.style.cssText = 'width:100%';
    btn.textContent = 'Submit';
    const doSubmit = () => {
      const val = input.value.trim().toLowerCase();
      const answer = (cfg.answer || '').toLowerCase();
      const variations = (cfg.accept_variations || []).map(v => v.toLowerCase());
      if (val === answer || variations.includes(val)) {
        if (cfg.follow_up && !wrap.dataset.step2) {
          wrap.dataset.step2 = 'true';
          prompt.textContent = cfg.follow_up.prompt;
          input.value = '';
          input.placeholder = 'Type your answer...';
          status.textContent = '✅ Accepted.';
          status.style.color = 'var(--green)';
          cfg.answer = cfg.follow_up.answer;
          cfg.accept_variations = cfg.follow_up.accept_variations || [];
          delete cfg.follow_up;
          setTimeout(() => { status.textContent = ''; status.style.color = ''; input.focus(); }, 800);
        } else {
          onSolve();
        }
      } else {
        const fo = cfg.falseOutputs;
        if (fo && fo.no_prerequisite && cfg.prerequisite) {
          const req = cfg.prerequisite.requires_card;
          if (req && !engine.visibleCards.has(req)) {
            status.textContent = fo.no_prerequisite;
            return;
          }
        }
        status.textContent = (fo && fo.wrong_answer) || 'Incorrect. Try again.';
        onFail((fo && fo.wrong_answer) || 'Incorrect.');
      }
    };
    btn.addEventListener('click', doSubmit);

function showDiscoverPopup(card) {
  lastPopupCard = card;
  const popup = document.getElementById('discover-popup');
  const img = document.getElementById('popup-img');
  if (card.image) { img.src = `${ASSET_BASE}/${card.image}`; img.style.display = ''; }
  else { img.style.display = 'none'; }
  document.getElementById('popup-type').textContent = card.type === 'item' ? 'Item Found' : card.type === 'object' ? 'Object Found' : card.type === 'lore' ? (engine.meta.lore_label || 'Memory Fragment') : card.type === 'event' ? 'Event' : 'Discovered';
  document.getElementById('popup-type').className = `popup-type ${card.color}`;
  document.getElementById('popup-title').textContent = card.title;
  document.getElementById('popup-desc').textContent = card.short_description || card.description;
  const flavor = document.getElementById('popup-flavor');
  if (card.flavor_text) { flavor.textContent = card.flavor_text; flavor.style.display = ''; }
  else { flavor.style.display = 'none'; }
  popup.classList.add('open');
}

function closePopup() {
  const popup = document.getElementById('discover-popup');
  const card = lastPopupCard;
  popup.classList.remove('open');
  document.querySelector('.popup-card').classList.remove('event-result');
  document.getElementById('popup-type').style.color = '';

  // Collect animation for items/objects
  if (card && (card.type === 'item' || card.type === 'object')) {
    const icon = card.type === 'item' ? '🔴' : '🔵';
    const el = document.createElement('div');
    el.className = 'collect-anim';
    el.textContent = icon;
    el.style.left = '50%';
    el.style.top = '50%';
    document.body.appendChild(el);
    const btn = document.getElementById('btn-combine-mode').getBoundingClientRect();
    requestAnimationFrame(() => {
      el.style.left = btn.left + btn.width / 2 + 'px';
      el.style.top = btn.top + btn.height / 2 + 'px';
      el.classList.add('fly');
    });
    setTimeout(() => {
      el.remove();
      document.getElementById('btn-combine-mode').classList.add('glow');
      setTimeout(() => document.getElementById('btn-combine-mode').classList.remove('glow'), 1500);
    }, 650);
  }
  lastPopupCard = null;
}

function closePuzzlePopup() {
  document.getElementById('puzzle-popup').classList.remove('open');
}

let newRoomCount = 0;
function showRoomUnlock(roomName) {
  // Badge on map button
  newRoomCount++;
  const btn = document.getElementById('btn-map');
  let badge = btn.querySelector('.badge-map');
  if (!badge) { badge = document.createElement('span'); badge.className = 'badge-map'; btn.appendChild(badge); }
  badge.textContent = newRoomCount;
  btn.classList.add('glow');

  // Slide-down bar
  const existing = document.querySelector('.room-unlock-bar');
  if (existing) existing.remove();
  const bar = document.createElement('div');
  bar.className = 'room-unlock-bar';
  bar.innerHTML = `<span class="unlock-icon">🔓</span><div><div class="unlock-text">${roomName}</div><div class="unlock-sub">New area unlocked — tap to view map</div></div>`;
  bar.addEventListener('click', () => { bar.classList.add('dismiss'); setTimeout(() => bar.remove(), 300); openMap(); });
  document.body.appendChild(bar);
  setTimeout(() => { if (bar.parentNode) { bar.classList.add('dismiss'); setTimeout(() => bar.remove(), 300); } }, 4000);
}

function renderTools() {
  const el = document.getElementById('tools-list');
  const tools = Object.values(engine.puzzles).filter(p => p.type === 'tool');
  if (!tools.length) { el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">No tools discovered yet.</p>'; return; }

  // Group by room
  const roomMap = {};
  tools.forEach(t => {
    const card = engine.cards[t.card_ref];
    const cardRoom = card?.room;
    const roomCard = Object.values(engine.cards).find(c => c.type === 'location' && c.room === cardRoom);
    const roomDef = roomCard ? engine.rooms.find(r => r.card_id === roomCard.id) : null;
    const roomName = roomDef?.name || roomCard?.title || 'Unknown';
    const roomUnlocked = roomCard ? engine.unlockedRooms.includes(roomCard.id) : false;
    if (!roomMap[roomName]) roomMap[roomName] = { unlocked: roomUnlocked, tools: [] };
    roomMap[roomName].tools.push(t);
  });

  let html = '';
  Object.entries(roomMap).forEach(([room, data]) => {
    data.tools.forEach(t => {
      const cls = data.unlocked ? 'tool-card' : 'tool-card locked';
      const onclick = data.unlocked ? `onclick="closeTools();showPuzzlePopup('${t.id}', -1)"` : '';
      const isNpc = t.ui === 'npc-dialog';
      const icon = isNpc ? (t.config?.portrait || '🧑') : '🔧';
      const costLabel = t.config?.time_cost_seconds ? ` (−${Math.floor(t.config.time_cost_seconds/60)} min)` : '';
      html += `<div class="${cls}" ${onclick}><div class="tool-room">${room}</div><div class="tool-name">${icon} ${t.description}${costLabel}</div><div class="tool-desc">${data.unlocked ? 'Tap to use' : 'Room not yet discovered'}</div></div>`;
    });
  });
  el.innerHTML = html;
}

function openMap() {
  document.getElementById('btn-map').classList.remove('glow');
  const mapBadge = document.querySelector('#btn-map .badge-map');
  if (mapBadge) mapBadge.remove();
  newRoomCount = 0;
  document.getElementById('main').style.display = 'none';
  document.getElementById('bottom-bar').style.display = 'none';
  document.getElementById('map-screen').classList.add('active');
  renderMap();
  // Auto-scroll to current room
  requestAnimationFrame(() => {
    const cur = document.querySelector('#map-list .map-room.current');
    if (cur) cur.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function closeMap() {
  document.getElementById('map-screen').classList.remove('active');

}

function renderMap() {
  const el = document.getElementById('map-list');
  const roomDefs = engine.rooms;
  const unlocked = new Set(engine.unlockedRooms);
  if (!roomDefs.length) { el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">No rooms discovered yet.</p>'; return; }

  // Check if rooms have map_pos (isometric) or fallback to list
  const hasPositions = roomDefs.some(r => r.map_pos);
  if (!hasPositions) { renderMapList(el, roomDefs, unlocked); return; }

  // Voxel map style — flat layout with pre-rendered isometric images
  if (engine.meta.map_style === 'voxel') { renderMapVoxel(el, roomDefs, unlocked); return; }

  let selectedMapRoom = null;
  let html = '<div class="iso-container"><div class="iso-floor" id="iso-floor"></div><div class="iso-info" id="iso-info"><div style="color:#666;font-size:13px">Tap a room to see details</div></div></div>';
  el.innerHTML = html;

  const floor = document.getElementById('iso-floor');
  const S = 1.4; // scale factor for spacing

  // Draw connectors
  roomDefs.forEach(r => {
    if (!r.map_pos) return;
    (r.connects_to || []).forEach(cid => {
      const target = roomDefs.find(t => t.card_id === cid);
      if (!target || !target.map_pos) return;
      const x1 = r.map_pos[0] * S + 60, y1 = r.map_pos[1] * S + 60;
      const x2 = target.map_pos[0] * S + 60, y2 = target.map_pos[1] * S + 60;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      const div = document.createElement('div');
      div.className = 'iso-connector';
      if (unlocked.has(r.card_id) && unlocked.has(cid)) div.classList.add('active');
      if (r.card_id === engine.currentRoom || cid === engine.currentRoom) div.classList.add('current-line');
      div.style.cssText = `left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${angle}deg)`;
      floor.appendChild(div);
    });
  });

  // Draw tiles
  roomDefs.forEach(r => {
    if (!r.map_pos) return;
    const id = r.card_id;
    const card = engine.cards[id];
    const isUnlocked = unlocked.has(id);
    const isCurrent = id === engine.currentRoom;
    const discoveries = card?.discoveries || [];
    const undone = discoveries.filter(d => {
      if (d.puzzle) { const p = engine.puzzles[d.puzzle]; if (p && (p.type === 'tool' || p.ui === 'npc-dialog')) return false; }
      return !engine.discoveredCards.has(d.card_id) && !engine.consumedCards.has(d.card_id);
    });
    const remaining = undone.length;
    const state = !isUnlocked ? 'locked' : isCurrent ? 'current' : 'explored';

    const tile = document.createElement('div');
    tile.className = `iso-tile ${state}`;
    tile.style.left = r.map_pos[0] * S + 'px';
    tile.style.top = r.map_pos[1] * S + 'px';
    tile.dataset.id = id;

    const imgSrc = card?.image ? `${ASSET_BASE}/${card.image}` : '';
    tile.innerHTML = `${imgSrc ? `<img src="${imgSrc}" onerror="this.style.display='none'">` : ''}${isCurrent ? '<div class="iso-pin"><div class="iso-pin-head"></div><div class="iso-pin-stick"></div></div>' : ''}${remaining > 0 && isUnlocked ? `<div class="iso-badge">${remaining}</div>` : ''}<div class="iso-label">${r.name}</div>`;

    tile.addEventListener('click', () => {
      if (!isUnlocked) return;
      if (selectedMapRoom === id) { goToRoom(id); return; }
      selectedMapRoom = id;
      floor.querySelectorAll('.iso-tile').forEach(t => t.classList.remove('selected'));
      tile.classList.add('selected');
      const status = isCurrent ? '📍 You are here' : remaining > 0 ? `⚠️ ${remaining} action${remaining > 1 ? 's' : ''} remaining` : '✅ Explored';
      const info = document.getElementById('iso-info');
      info.innerHTML = `<div class="iso-info-name">${r.name}</div><div class="iso-info-status">${status}</div>${r.unlock_text ? `<div class="iso-info-unlock">${r.unlock_text}</div>` : ''}${!isCurrent ? `<button class="iso-info-btn" onclick="goToRoom(${id})">Go Here</button>` : ''}`;
    });

    floor.appendChild(tile);
  });
}

// Voxel map — flat layout with pre-rendered isometric voxel images

  const floor = document.getElementById('iso-floor');

  // Connectors

    if (!r.map_pos) return;

      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
