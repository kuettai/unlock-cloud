<div class="container">
  <!-- QR Gate: shown when no game_id -->
  <div id="qr-gate" style="display:none;text-align:center;padding:60px 20px">
    <div style="font-size:64px;margin-bottom:20px">📱</div>
    <h2 style="font-size:20px;margin-bottom:12px">Scan the QR Code</h2>
    <p style="color:var(--muted);font-size:14px;line-height:1.6;max-width:280px;margin:0 auto">Scan the QR code at the booth or event to join a game session.</p>
    <div style="margin-top:32px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-width:280px;margin-left:auto;margin-right:auto">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Or enter a game code:</div>
      <input id="gate-code-input" type="text" placeholder="e.g. abc123" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;text-align:center;margin-bottom:8px">
      <button onclick="submitGateCode()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Join Game</button>
    </div>
  </div>

  <!-- Main content: shown when game_id present -->
  <div id="main-content" style="display:none">
    <h1>🧩 re:Solve</h1>
    <p class="subtitle" id="subtitle">Choose a category</p>
    <div class="mode-toggle">
      <button class="mode-btn" data-mode="normal" onclick="setMode('normal')">Normal</button>
      <button class="mode-btn" data-mode="challenge" onclick="setMode('challenge')">Challenge</button>
    </div>
    <button class="back-btn" id="back-btn" onclick="showCategories()">← Back to categories</button>
    <div id="content"><div class="loading">Loading...</div></div>
  </div>
</div>

<script src="home.js" charset="utf-8"></script>

<div class="kiro-peek" onclick="window.open('https://kiro.dev','_blank')">
  <span class="kiro-ghost">👻</span>
  <span class="kiro-text"></span>
</div>
