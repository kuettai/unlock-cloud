<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map View — 2.5D Café Floor Plan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0a0e17; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
h1 { font-size: 1rem; color: #888; margin-bottom: 1rem; }

.map-container {
  width: 600px;
  height: 600px;
  position: relative;
}

.map-floor {
  width: 100%;
  height: 100%;
  position: relative;
}

.map-tile {
  position: absolute;
  width: 200px;
  height: 200px;
  border: none;
  border-radius: 0;
  background: transparent;
  cursor: pointer;
  transition: all 0.3s;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0;
}

.map-tile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 0;
}

.map-tile .tile-label {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  background: rgba(10,14,23,0.95);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #444;
  white-space: nowrap;
  pointer-events: none;
}

.map-tile .tile-badge {
  position: absolute;
  top: 30%;
  right: 10%;
  z-index: 2;
  background: #e94560;
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.map-tile.current {
  filter: drop-shadow(0 0 8px rgba(59,130,246,0.6));
}
.map-tile.current img { opacity: 1; }

.map-tile.explored {
  filter: drop-shadow(0 0 6px rgba(34,197,94,0.4));
}
.map-tile.explored img { opacity: 0.85; }

.map-tile.locked {
  opacity: 0.3;
  cursor: default;
  filter: grayscale(1);
}

.map-tile:hover:not(.locked),
.map-tile:active:not(.locked) {
  transform: scale(1.08);
  filter: drop-shadow(0 0 12px rgba(243,156,18,0.5));
}
.map-tile.selected {
  transform: scale(1.08);
  filter: drop-shadow(0 0 12px rgba(243,156,18,0.6)) !important;
}

.map-tile .tile-marker {
  position: absolute;
  top: 20%;
  left: 40%;
  z-index: 3;
  font-size: 28px;
  animation: bounce 1.5s ease infinite;
  filter: drop-shadow(0 4px 3px rgba(0,0,0,0.5));
}
.pin-head {
  width: 16px;
  height: 16px;
  background: #e94560;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid #fff;
}
.pin-stick {
  width: 3px;
  height: 36px;
  background: #888;
  border-radius: 0 0 2px 2px;
  margin-top: -2px;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.2); }
}

/* Connectors */
.map-connector {
  position: absolute;
  background: #1e2a45;
  z-index: 0;
}
.map-connector.active { background: #22c55e; }
.map-connector.current { background: #3b82f6; }

/* Legend */
.legend {
  margin-top: 1rem;
  display: flex;
  gap: 1rem;
  font-size: 11px;
  color: #888;
}

/* Info panel */
.map-info {
  margin-top: 1rem;
  width: 360px;
  min-height: 60px;
  background: #141b2d;
  border: 1px solid #1e2a45;
  border-radius: 10px;
  padding: 12px 16px;
  text-align: center;
}
.map-info-text { color: #666; font-size: 13px; }
.map-info-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.map-info-status { font-size: 12px; color: #888; margin-bottom: 4px; }
.map-info-unlock { font-size: 11px; color: #666; font-style: italic; margin-bottom: 8px; }
.map-info-actions { font-size: 12px; color: #f39c12; margin-bottom: 8px; }
.map-info-btn { padding: 8px 20px; border: none; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.map-info-btn:active { background: #2563eb; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<h1>☕ Café 153 — Floor Plan</h1>

<div class="map-container">
  <div class="map-floor" id="map-floor"></div>
</div>

<div class="map-info" id="map-info">
  <div class="map-info-text">Tap a room to see details</div>
</div>

<div class="legend">
  <span><span class="dot" style="background:#3b82f6"></span> You are here</span>
  <span><span class="dot" style="background:#22c55e"></span> Explored</span>
  <span><span class="dot" style="background:#e94560"></span> Actions left</span>
  <span><span class="dot" style="background:#333"></span> Locked</span>
</div>

<script>
// Room layout — x,y positions on the isometric grid
const rooms = [
  { id: 1, name: 'Back Door', image: '../scenarios/bible-jesus-miracles/ep2-153-fish/25maps/back-door.png', x: 230, y: 420, state: 'explored', unlock: 'You pull into the empty car park. No other cars. Just you.' },
  { id: 10, name: 'Store Room', image: '../scenarios/bible-jesus-miracles/ep2-153-fish/25maps/store-room.png', x: 100, y: 320, state: 'explored', unlock: 'The keypad beeps green. The door clicks open. Cold air and coffee beans.' },
  { id: 20, name: 'Brew Station', image: '../scenarios/bible-jesus-miracles/ep2-153-fish/25maps/brew-station.png', x: 230, y: 220, state: 'current', badge: 2, unlock: 'You carry supplies to the brew station. The machine is cold.' },
  { id: 30, name: 'Service Counter', image: '../scenarios/bible-jesus-miracles/ep2-153-fish/25maps/service-counter.png', x: 360, y: 320, state: 'explored', unlock: 'The machine is dialed in. Time to set up the counter.' },
  { id: 40, name: 'The Floor', image: '../scenarios/bible-jesus-miracles/ep2-153-fish/25maps/the-floor.png', x: 230, y: 60, state: 'locked', badge: 3, unlock: 'Everything\'s ready behind the counter. Time to set up the floor.' },
];

// Connections between rooms
const connections = [
  { from: 1, to: 10 },
  { from: 10, to: 20 },
  { from: 20, to: 30 },
  { from: 30, to: 40 },
];

const floor = document.getElementById('map-floor');

// Draw connectors first
connections.forEach(c => {
  const fromRoom = rooms.find(r => r.id === c.from);
  const toRoom = rooms.find(r => r.id === c.to);
  if (!fromRoom || !toRoom) return;

  const div = document.createElement('div');
  div.className = 'map-connector';

  const x1 = fromRoom.x + 100, y1 = fromRoom.y + 100;
  const x2 = toRoom.x + 100, y2 = toRoom.y + 100;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;

  div.style.left = x1 + 'px';
  div.style.top = y1 + 'px';
  div.style.width = len + 'px';
  div.style.height = '3px';
  div.style.transformOrigin = '0 50%';
  div.style.transform = `rotate(${angle}deg)`;

  // Color based on state
  const bothExplored = fromRoom.state !== 'locked' && toRoom.state !== 'locked';
  if (bothExplored) div.classList.add('active');
  if (fromRoom.state === 'current' || toRoom.state === 'current') div.classList.add('current');

  floor.appendChild(div);
});

let selectedRoom = null;

function selectRoom(room) {
  // If tapping the already-selected room, navigate
  if (selectedRoom === room.id) {
    alert(`Navigating to: ${room.name}`);
    return;
  }
  selectedRoom = room.id;

  // Highlight selected tile
  document.querySelectorAll('.map-tile').forEach(t => t.classList.remove('selected'));
  document.querySelector(`.map-tile[data-id="${room.id}"]`)?.classList.add('selected');

  // Update info panel
  const status = room.state === 'current' ? '📍 You are here' : room.state === 'explored' ? '✅ Explored' : '🔒 Locked';
  const actions = room.badge ? `⚠️ ${room.badge} action${room.badge > 1 ? 's' : ''} remaining` : 'All clear';
  const info = document.getElementById('map-info');
  info.innerHTML = `<div class="map-info-name">${room.name}</div><div class="map-info-status">${status}</div>${room.unlock ? `<div class="map-info-unlock">${room.unlock}</div>` : ''}<div class="map-info-actions">${actions}</div>${room.state === 'current' ? '' : `<button class="map-info-btn" onclick="alert('Navigating to: ${room.name}')">Go Here</button>`}`;
}

// Draw room tiles
rooms.forEach(room => {
  const tile = document.createElement('div');
  tile.className = `map-tile ${room.state}`;
  tile.style.left = room.x + 'px';
  tile.style.top = room.y + 'px';
  tile.dataset.id = room.id;

  tile.innerHTML = `
    <img src="${room.image}" onerror="this.style.display='none'">
    ${room.state === 'current' ? '<div class="tile-marker">📍</div>' : ''}
    ${room.badge && room.state !== 'locked' ? `<div class="tile-badge">${room.badge}</div>` : ''}
    <div class="tile-label">${room.name}</div>
  `;

  tile.addEventListener('click', () => {
    if (room.state === 'locked') return;
    selectRoom(room);
  });

  floor.appendChild(tile);
});
</script>
</body>
</html>
